<html>
    <body>
        <section>
            <img class="mySlides" img src="Nature1.jpg" style="height: 450px;"
            <img class="mySlides" img src="Nature2.jpg" style="height: 450px;"
            <img class="mySlides" img src="Nature3.jpg" style="height: 450px;"
            <img class="mySlides" img src="Nature4.jpg" style="height: 450px;"
            <img class="mySlides" img src="Nature5.jpg" style="height: 450px;"
        </section>
    <script>

        var myIndex = 0;
        carousel();
        function carousel() {
            var i;
                var x = document.getElementsByClassName("mySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) {myIndex = 1}
                x[myIndex - 1].style.display = "block";
                setTimeout(carousel, 3000);
}

    </script>
    </body>
</html>
